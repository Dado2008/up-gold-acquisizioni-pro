<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UP GOLD CRM PRO</title><style>
*{box-sizing:border-box}body{margin:0;background:#101012;color:#eee;font:15px system-ui}header{padding:24px;border-bottom:1px solid #51432b;color:#e4bd6b;font: bold 25px Georgia}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px}button,input,select,textarea{font:inherit;padding:11px;border:1px solid #655438;border-radius:8px;background:#202023;color:#eee}button{cursor:pointer}button.active,button.primary{background:#e4bd6b;color:#15110a}main{max-width:1100px;margin:auto;padding:18px}.panel{background:#19191c;border:1px solid #39332a;border-radius:14px;padding:20px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.num{font-size:30px;color:#e4bd6b}label{display:grid;gap:6px;margin:8px 0}form{display:grid;gap:8px}small{color:#bcb4a6}h1,h2{font-weight:600}article{border-bottom:1px solid #40382c;padding:12px 0}.warn{color:#edc77f}a{color:#e4bd6b}</style><header>UP GOLD · CRM PRO</header><nav id="nav"></nav><main><p class="warn">Anteprima di sviluppo — dati dimostrativi in memoria, nessun accesso protetto. Non inserire dati reali.</p><section id="view"></section></main><footer style="padding:22px;text-align:center;border-top:1px solid #51432b"><a href="./privacy.html" target="_blank" rel="noopener noreferrer">Informativa Privacy · UP GOLD</a></footer><script>
const sections=['Oggi','Dashboard','Proprietari','Immobili','Calendario','Previsionali','Contratti','Amministrazione','WhatsApp','Assistente AI','Report'];const states=['Nuovo','Da contattare','Contattato','In attesa','Appuntamento','Previsionale inviato','Firmato','Non interessato','Non risponde'];const today=new Date().toLocaleDateString('sv-SE');let contacts=[{name:'Proprietario demo A',state:'Da contattare',due:today,history:[]},{name:'Proprietario demo B',state:'Appuntamento',due:today,history:[]}];let current='Oggi';const nav=document.querySelector('#nav'),view=document.querySelector('#view');function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;if(parent)parent.append(n);return n}function button(text,fn,parent){const b=el('button',text,parent);b.onclick=fn;return b}function panel(title){const p=el('div','',view);p.className='panel';el('h2',title,p);return p}function field(parent,label,type='text'){const l=el('label',label,parent),i=document.createElement('input');i.type=type;l.append(i);return i}function list(p,items){if(!items.length)el('p','Nessun nominativo.',p);items.forEach(c=>{const a=el('article','',p);el('strong',c.name,a);el('p',c.state+' · Prossima azione: '+(c.due||'non fissata'),a);button('Aggiorna scheda',()=>detail(c),a)})}function detail(c){view.replaceChildren();const p=panel(c.name);const s=document.createElement('select');states.forEach(x=>{const o=el('option',x,s);o.selected=x===c.state});p.append(s);const due=field(p,'Prossimo richiamo','date');due.value=c.due||'';const note=field(p,'Esito / nota dimostrativa');button('Registra aggiornamento',()=>{c.history.unshift(new Date().toLocaleString('it-IT')+' — '+c.state+' → '+s.value+' — '+note.value);c.state=s.value;c.due=due.value;detail(c)},p);el('h3','Storico attività',p);c.history.forEach(x=>el('p',x,p));button('Torna a Oggi',()=>render('Oggi'),p)}function render(name){current=name;nav.replaceChildren();sections.forEach(x=>{const b=button(x,()=>render(x),nav);if(x===name)b.className='active'});view.replaceChildren();el('h1',name==='Oggi'?'La tua giornata':name,view);if(name==='Oggi'){el('p',new Date().toLocaleDateString('it-IT',{dateStyle:'full'}),view);list(panel('Richiami di oggi e arretrati'),contacts.filter(c=>c.due&&c.due<=today&&c.state!=='Appuntamento'));list(panel('Appuntamenti di oggi'),contacts.filter(c=>c.due===today&&c.state==='Appuntamento'))}else if(name==='Proprietari'){const p=panel('Nuovo nominativo dimostrativo');const n=field(p,'Nome fittizio');const privacyLink=el('p','',p);privacyLink.innerHTML='Prima di raccogliere dati personali, consulta l\' <a href="./privacy.html" target="_blank" rel="noopener noreferrer">Informativa Privacy (bozza)</a>. Non inserire dati reali finché non è completata.';button('Aggiungi',()=>{if(n.value.trim()){contacts.push({name:n.value.trim(),state:'Nuovo',due:today,history:[]});render(name)}},p);list(panel('Tutti i proprietari'),contacts)}else if(name==='Dashboard'||name==='Report'){const p=panel('Riepilogo');el('p','Nominativi: '+contacts.length,p);el('p','Azioni in scadenza: '+contacts.filter(c=>c.due&&c.due<=today).length,p);states.forEach(s=>el('p',s+': '+contacts.filter(c=>c.state===s).length,p))}else if(name==='Calendario'){list(panel('Azioni programmate'),contacts.filter(c=>c.due).sort((a,b)=>a.due.localeCompare(b.due)))}else if(name==='Previsionali'){const p=panel('Simulazione indicativa annuale');const adr=field(p,'Tariffa per notte (€)','number'),occ=field(p,'Occupazione (%)','number'),ota=field(p,'Commissione OTA (%)','number'),mg=field(p,'Gestione (%)','number'),cost=field(p,'Altri costi annui (€)','number');const out=el('p','',p);button('Calcola',()=>{let a=+adr.value,o=+occ.value,t=+ota.value,m=+mg.value,c=+cost.value;if([a,o,t,m,c].some(x=>!Number.isFinite(x)||x<0)||o>100||t+m>100){out.textContent='Controlla i valori';return}let gross=a*365*o/100;out.textContent='Lordo: € '+gross.toFixed(2)+' · Netto prima delle imposte: € '+(gross*(1-(t+m)/100)-c).toFixed(2)},p)}else{el('p','Modulo previsto: implementazione e collegamenti da completare.',panel(name))}}render('Oggi');</script></html>
