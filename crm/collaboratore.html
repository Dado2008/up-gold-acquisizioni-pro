<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UP GOLD CRM PRO | Accesso</title><style>body{background:#111;color:#eee;font:16px system-ui;max-width:850px;margin:35px auto;padding:20px}h1,h2{color:#d5ac55}input,button,select{font:inherit;padding:12px;margin:5px;background:#222;color:#eee;border:1px solid #a78a50;border-radius:7px}button{cursor:pointer}article{padding:15px;border-bottom:1px solid #555}label{display:block}small{display:block;margin:10px}</style><h1>UP GOLD CRM PRO · Collaboratore</h1><p id="status" role="status">Connessione in configurazione.</p><form id="login" hidden><label>Email <input id="email" type="email" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button>Accedi</button><button type="button" id="recover">Password dimenticata</button></form><form id="reset" hidden><label>Nuova password <input id="newpass" type="password" minlength="8" required autocomplete="new-password"></label><button>Salva nuova password</button></form><main id="workspace" hidden><button id="logout">Esci</button><h2>Oggi</h2><div id="today"></div><h2>Nuovo nominativo</h2><form id="add"><input id="name" placeholder="Nome" required><input id="phone" placeholder="Telefono"><input id="due" type="date"><button>Salva</button></form><h2>I miei nominativi</h2><div id="all"></div><h2>Storico</h2><div id="history"></div></main><script type="module">
const $=id=>document.getElementById(id), status=$('status');let db;const states=['Nuovo','Da contattare','Contattato','In attesa','Appuntamento','Previsionale inviato','Firmato','Non interessato','Non risponde'];function say(s){status.textContent=s}function node(tag,value,parent){let n=document.createElement(tag);n.textContent=value;parent.append(n);return n}async function showHistory(id){const {data,error}=await db.from('crm_activities').select('kind,notes,created_at').eq('contact_id',id).order('created_at',{ascending:false});if(error){say(error.message);return}$('history').replaceChildren();for(const a of data)node('p',new Date(a.created_at).toLocaleString('it-IT')+' · '+a.kind+' · '+(a.notes||''),$('history'))}function row(c,p){let a=node('article','',p);node('strong',c.name,a);node('small',(c.phone||'')+' · '+(c.next_action||'Nessuna scadenza'),a);let s=node('select','',a);states.forEach(v=>{let o=node('option',v,s);o.selected=v===c.state});let d=node('input','',a);d.type='date';d.value=c.next_action||'';node('button','Aggiorna',a).onclick=async()=>{const {error}=await db.from('crm_contacts').update({state:s.value,next_action:d.value||null}).eq('id',c.id);if(error)say(error.message);else await load()};node('button','Storico',a).onclick=()=>showHistory(c.id);node('button','Assegna all’amministratore',a).onclick=async function(){if(!confirm('Trasferire questo nominativo all’amministratore?'))return;this.disabled=true;try{const {error}=await db.rpc('crm_transfer_to_admin',{contact:c.id});if(error){say('Trasferimento non riuscito: '+error.message);return;}$('history').replaceChildren();await load();say('Nominativo trasferito all’amministratore');}catch(e){say('Errore di connessione: verifica lo stato prima di riprovare');}finally{this.disabled=false}}}async function load(){const {data,error}=await db.from('crm_contacts').select('*').order('next_action',{ascending:true});if(error){say(error.message);return}let date=new Date().toLocaleDateString('sv-SE');$('today').replaceChildren();$('all').replaceChildren();for(const c of data){row(c,$('all'));if(c.next_action&&c.next_action<=date)row(c,$('today'))}say('Accesso riservato attivo');}async function gate(){const {data:{session}}=await db.auth.getSession();$('workspace').hidden=true;$('login').hidden=!!session;if(!session){$('all').replaceChildren();$('today').replaceChildren();$('history').replaceChildren();say('Accedi con il tuo account');return}const {data,error}=await db.rpc('crm_role');if(error||data!=="collaborator"){await db.auth.signOut();$('login').hidden=false;say(error ? 'Verifica ruolo: '+error.message : 'Accesso non autorizzato per questo profilo');return}$('workspace').hidden=false;await load()}try{const {config}=await import('./config.js');if(!config.url||!config.publishableKey)throw Error('Configurazione mancante');const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(config.url,config.publishableKey);let recovering=location.hash.includes('type=recovery');db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;$('login').hidden=true;$('workspace').hidden=true;$('reset').hidden=false;say('Imposta la nuova password');}});$('recover').onclick=async()=>{const email=$('email').value.trim();if(!email){say('Inserisci la tua email');return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});say(error?error.message:'Se l’account esiste, riceverai una email di recupero');};$('reset').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:$('newpass').value});if(error){say(error.message);return}recovering=false;$('reset').hidden=true;await db.auth.signOut();history.replaceState(null,'',location.pathname);await gate();say('Password aggiornata. Accedi nuovamente.');};$('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)say('Accesso non riuscito: '+error.message);else await gate()};$('logout').onclick=async()=>{await db.auth.signOut();await gate()};$('add').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('crm_contacts').insert({name:$('name').value,phone:$('phone').value,next_action:$('due').value||null});if(error)say(error.message);else{e.target.reset();await load()}};if(!recovering)await gate()}catch(e){say('Errore di connessione: '+e.message);}
</script></html>
