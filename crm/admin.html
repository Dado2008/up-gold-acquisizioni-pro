<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UP GOLD CRM PRO | Accesso</title><style>body{background:#111;color:#eee;font:16px system-ui;max-width:850px;margin:35px auto;padding:20px}h1,h2{color:#d5ac55}input,button,select,textarea{font:inherit;padding:12px;margin:5px;background:#222;color:#eee;border:1px solid #a78a50;border-radius:7px}button{cursor:pointer}article{padding:15px;border-bottom:1px solid #555}label{display:block}small{display:block;margin:10px}textarea{display:block;width:95%;box-sizing:border-box;min-height:90px} details{border:1px solid #54482f;border-radius:8px;margin:9px 0;padding:12px} summary{cursor:pointer;color:#d5ac55} #feedback{color:#e7c77f} </style><h1>UP GOLD CRM PRO · Amministratore</h1><p id="status" role="status">Connessione in configurazione.</p><form id="login" hidden><label>Email <input id="email" type="email" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button>Accedi</button><button type="button" id="recover">Password dimenticata</button></form><form id="reset" hidden><label>Nuova password <input id="newpass" type="password" minlength="8" required autocomplete="new-password"></label><button>Salva nuova password</button></form><main id="workspace" hidden><button id="logout">Esci</button><h2>Oggi</h2><div id="today"></div><h2>Nuovo nominativo</h2><form id="add"><input id="name" placeholder="Nome" required><input id="phone" placeholder="Telefono"><input id="due" type="date"><select id="region"><option value="">Seleziona regione</option><option>Abruzzo</option><option>Basilicata</option><option>Calabria</option><option>Campania</option><option>Emilia-Romagna</option><option>Friuli-Venezia Giulia</option><option>Lazio</option><option>Liguria</option><option>Lombardia</option><option>Marche</option><option>Molise</option><option>Piemonte</option><option>Puglia</option><option>Sardegna</option><option>Sicilia</option><option>Toscana</option><option>Trentino-Alto Adige</option><option>Umbria</option><option>Valle d’Aosta</option><option>Veneto</option></select><input id="city" placeholder="Comune"><textarea id="notes" placeholder="Note sul proprietario e sulla trattativa"></textarea><button type="submit">Salva nominativo</button><p id="feedback" role="status"></p></form><h2>Tutti i nominativi</h2><label>Filtra per regione <select id="filter"><option value="*">Tutta Italia</option><option value="">Da assegnare</option><option>Abruzzo</option><option>Basilicata</option><option>Calabria</option><option>Campania</option><option>Emilia-Romagna</option><option>Friuli-Venezia Giulia</option><option>Lazio</option><option>Liguria</option><option>Lombardia</option><option>Marche</option><option>Molise</option><option>Piemonte</option><option>Puglia</option><option>Sardegna</option><option>Sicilia</option><option>Toscana</option><option>Trentino-Alto Adige</option><option>Umbria</option><option>Valle d’Aosta</option><option>Veneto</option></select></label><div id="all"></div><h2>Storico</h2><div id="history"></div></main><script type="module">
const $=id=>document.getElementById(id), status=$('status');let db;const regions=["Abruzzo","Basilicata","Calabria","Campania","Emilia-Romagna","Friuli-Venezia Giulia","Lazio","Liguria","Lombardia","Marche","Molise","Piemonte","Puglia","Sardegna","Sicilia","Toscana","Trentino-Alto Adige","Umbria","Valle d’Aosta","Veneto"];let contacts=[];const states=['Nuovo','Da contattare','Contattato','In attesa','Appuntamento','Previsionale inviato','Firmato','Non interessato','Non risponde'];function say(s){status.textContent=s}function node(tag,value,parent){let n=document.createElement(tag);n.textContent=value;parent.append(n);return n}async function showHistory(id){const {data,error}=await db.from('crm_activities').select('kind,notes,created_at').eq('contact_id',id).order('created_at',{ascending:false});if(error){say(error.message);return}$('history').replaceChildren();for(const a of data)node('p',new Date(a.created_at).toLocaleString('it-IT')+' · '+a.kind+' · '+(a.notes||''),$('history'))}function row(c,p){let a=node('article','',p);node('strong',c.name,a);node('small',(c.phone||'')+' · '+(c.next_action||'Nessuna scadenza'),a);node('small',c.region||'Regione da assegnare',a);let rg=node('select','',a);let blank=node('option','Da assegnare',rg);blank.value='';regions.forEach(v=>{let o=node('option',v,rg);o.selected=v===c.region});let city=node('input','',a);city.placeholder='Comune';city.value=c.city||'';let notes=node('textarea','',a);notes.placeholder='Note';notes.value=c.notes||'';let s=node('select','',a);states.forEach(v=>{let o=node('option',v,s);o.selected=v===c.state});let d=node('input','',a);d.type='date';d.value=c.next_action||'';node('button','Aggiorna',a).onclick=async()=>{const {error}=await db.from('crm_contacts').update({state:s.value,next_action:d.value||null,region:rg.value||null,city:city.value.trim(),notes:notes.value}).eq('id',c.id);if(error)say(error.message);else await load()};node('button','Storico',a).onclick=()=>showHistory(c.id)}async function load(){const {data,error}=await db.from('crm_contacts').select('*').order('next_action',{ascending:true});if(error){say(error.message);return}let date=new Date().toLocaleDateString('sv-SE');$('today').replaceChildren();$('all').replaceChildren();contacts=data;renderRegions();for(const c of data){if(c.next_action&&c.next_action<=date)row(c,$('today'))}say('Accesso riservato attivo');}function renderRegions(){const p=$('all');p.replaceChildren();const filter=$('filter').value;for(const r of [...regions,'']){if(filter!=='*'&&filter!==r)continue;const list=contacts.filter(c=>(c.region||'')===r);const section=node('details','',p);section.open=filter!=='*'||list.length>0;node('summary',(r||'Da assegnare')+' · '+list.length,section);if(!list.length)node('small','Nessun nominativo',section);for(const c of list)row(c,section)}}$('filter').onchange=renderRegions;async function gate(){const {data:{session}}=await db.auth.getSession();$('workspace').hidden=true;$('login').hidden=!!session;if(!session){$('all').replaceChildren();$('today').replaceChildren();$('history').replaceChildren();say('Accedi con il tuo account');return}const {data,error}=await db.rpc('crm_role');if(error||data!=="admin"){await db.auth.signOut();$('login').hidden=false;say(error ? 'Verifica ruolo: '+error.message : 'Accesso non autorizzato per questo profilo');return}$('workspace').hidden=false;await load()}try{const {config}=await import('./config.js');if(!config.url||!config.publishableKey)throw Error('Configurazione mancante');const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(config.url,config.publishableKey);let recovering=location.hash.includes('type=recovery');db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;$('login').hidden=true;$('workspace').hidden=true;$('reset').hidden=false;say('Imposta la nuova password');}});$('recover').onclick=async()=>{const email=$('email').value.trim();if(!email){say('Inserisci la tua email');return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});say(error?error.message:'Se l’account esiste, riceverai una email di recupero');};$('reset').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:$('newpass').value});if(error){say(error.message);return}recovering=false;$('reset').hidden=true;await db.auth.signOut();history.replaceState(null,'',location.pathname);await gate();say('Password aggiornata. Accedi nuovamente.');};$('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)say('Accesso non riuscito: '+error.message);else await gate()};$('logout').onclick=async()=>{await db.auth.signOut();await gate()};$('add').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('crm_contacts').insert({name:$('name').value.trim(),phone:$('phone').value.trim(),next_action:$('due').value||null,region:$('region').value||null,city:$('city').value.trim(),notes:$('notes').value});if(error){say(error.message);$('feedback').textContent='Salvataggio non riuscito: '+error.message;}else{e.target.reset();await load();$('feedback').textContent='Nominativo salvato correttamente';}};if(!recovering)await gate()}catch(e){say('Errore di connessione: '+e.message);}
</script></html>
